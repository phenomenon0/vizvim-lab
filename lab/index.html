<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vizvim lab</title>
<script>window.VZ_PUBLIC = 1</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0c0d0f; --panel:#131518; --line:#23262b; --fg:#d9dce1; --dim:#7d848e; --acc:#19e0c8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display:flex; height:100%; }
  #stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; position:relative; overflow:hidden; }
  #stage canvas { max-width:100%; max-height:100%; min-width:0; background:#000; display:block; }
  #stage.pair canvas { max-width:calc(50% - 3px); }
  #stage #ref { display:none; } #stage.pair #ref { display:block; }
  #err { position:absolute; left:8px; right:8px; bottom:8px; margin:0; padding:10px; background:#2a0d10e8; color:#ff9aa5; border:1px solid #7a2630; white-space:pre-wrap; max-height:50%; overflow:auto; display:none; z-index:5; }
  #drop { position:absolute; inset:8px; border:2px dashed var(--acc); display:none; align-items:center; justify-content:center; color:var(--acc); font-size:16px; background:#0c0d0fcc; z-index:6; }
  #panel { width:248px; flex:none; background:var(--panel); padding:10px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; }
  #panel h1 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:0; font-weight:500; }
  select, button { font:inherit; color:var(--fg); background:#1b1e22; border:1px solid var(--line); border-radius:5px; padding:4px 6px; width:100%; }
  .row { display:flex; flex-direction:column; gap:3px; }
  .row .top { display:flex; justify-content:space-between; gap:6px; color:var(--dim); }
  .row .top span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:auto; }
  .row .top b { color:var(--fg); font-weight:500; }
  .row .top .drv { color:var(--acc); }
  input[type=range] { width:100%; margin:0; accent-color:var(--acc); height:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { width:auto; padding:3px 8px; border-radius:999px; cursor:pointer; background:#1b1e22; border:1px solid var(--line); color:var(--dim); user-select:none; }
  .chip.on { color:#06110f; background:var(--acc); border-color:var(--acc); }
  input[type=color] { width:100%; height:22px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; }
  #hud { color:var(--dim); white-space:pre-wrap; overflow-wrap:anywhere; margin-top:auto; font-size:11px; }
  #status { color:var(--acc); min-height:1.3em; }
  .hide { display:none !important; }
  /* narrow window: picture on top, panel underneath at full width */
  @media (max-width: 640px) {
    #app { flex-direction:column; }
    #stage { flex:none; height:46vh; }
    #panel { width:auto; flex:1; min-height:0; }
  }

  #nav { display:flex; align-items:center; gap:6px; }
  #nav a { color:var(--fg); text-decoration:none; padding:6px 10px; border-radius:6px; background:#1b1e22; }
  #nav a:hover { background:#24282d; }
  #nav #fxName { flex:1; font:600 14px/1.2 -apple-system, system-ui, sans-serif; padding-left:4px; }
  #panel h1, #fxPick { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="ref"></canvas>
    <canvas id="out"></canvas>
    <pre id="err"></pre>
    <div id="drop">drop a photo or video</div>
  </div>
  <div id="panel">
    <nav id="nav"><a href="../" title="All effects">&larr; Effects</a><span id="fxName"></span><a id="prev" title="Previous">&lsaquo;</a><a id="next" title="Next">&rsaquo;</a></nav>
    <h1>vizvim fx-lab</h1>
    <select id="fxPick" title="effect"></select>
    <select id="srcPick" title="source"></select>
    <div id="status"></div>
    <div id="params"></div>
    <div id="sections" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="chips" id="tools"></div>
    <div id="hud"></div>
  </div>
</div>
<script type="module" src="./harness.js"></script>
<script type="module">
const m = await (await fetch('./menu.json')).json();
const id = new URLSearchParams(location.search).get('fx') || m[0][0];
const i = Math.max(0, m.findIndex(e => e[0] === id)), go = k => '?fx=' + m[(i + k + m.length) % m.length][0];
document.getElementById('fxName').textContent = m[i][1]; document.title = m[i][1] + ' - vizvim lab';
document.getElementById('prev').href = go(-1); document.getElementById('next').href = go(1);
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') location.href = go(-1); if (e.key === 'ArrowRight') location.href = go(1); });
</script>
</body>
</html>
